# Netlify configuration for Zerion CRM (Vite SPA)
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single-Page-App fallback: every route is served by index.html so that
# client-side routes (/leads, /tareas, /equipo) work on direct load & refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Sensible security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
